name: CI

on:
  push:
    branches: [main, supabase]
  pull_request:

jobs:
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - name: Secrets locaux des fonctions (paiement factice)
        run: |
          cat > supabase/functions/.env <<ENV
          PAYMENT_PROVIDER=fake
          FAKE_WEBHOOK_SECRET=ci-$(openssl rand -hex 16)
          FAKE_CHECKOUT_ENABLED=true
          PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          CHECKOUT_RETURN_URL=folio://checkout/return
          CHECKOUT_RETURN_PREFIXES=folio://,exp://
          MAIL_DRIVER=console
          CRON_SECRET=ci-$(openssl rand -hex 16)
          ENV
      - run: supabase start -x imgproxy,supavisor,studio,logflare,vector
      - name: Variables des tests
        working-directory: supabase/tests
        run: |
          supabase status -o env | sed -n 's/^API_URL=/SUPABASE_URL=/p; s/^ANON_KEY=/SUPABASE_ANON_KEY=/p; s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p; s/^DB_URL=/DB_URL=/p' | tr -d '"' > .env
      - run: npm ci
        working-directory: supabase/tests
      - run: npm test
        working-directory: supabase/tests

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo-doctor
